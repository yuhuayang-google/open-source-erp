apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-worker
  namespace: erp-system
  labels:
    app: erp-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-worker
  template:
    metadata:
      labels:
        app: erp-worker
        tier: worker
    spec:
      serviceAccountName: erp-worker-ksa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: erp-worker
          image: gcr.io/YOUR_PROJECT_ID/erp-worker:latest
          envFrom:
            - configMapRef:
                name: erp-config
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1024Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Scheduled Nightly Material Requirements Planning (MRP) & Multi-Level BOM Explosion Run
apiVersion: batch/v1
kind: CronJob
metadata:
  name: erp-mrp-nightly
  namespace: erp-system
spec:
  schedule: "0 2 * * *" # Every night at 02:00 UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: erp-worker-ksa
          restartPolicy: OnFailure
          containers:
            - name: mrp-runner
              image: gcr.io/YOUR_PROJECT_ID/erp-worker:latest
              args: ["--job", "mrp-explosion-run"]
              envFrom:
                - configMapRef:
                    name: erp-config
              resources:
                requests:
                  cpu: "1000m"
                  memory: "512Mi"
                limits:
                  cpu: "4000m"
                  memory: "2048Mi"
---
# Scheduled Daily Currency Exchange Rate Sync & Trial Balance Integrity Audit
apiVersion: batch/v1
kind: CronJob
metadata:
  name: erp-ledger-audit-daily
  namespace: erp-system
spec:
  schedule: "30 0 * * *" # Daily at 00:30 UTC
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: erp-worker-ksa
          restartPolicy: OnFailure
          containers:
            - name: ledger-auditor
              image: gcr.io/YOUR_PROJECT_ID/erp-worker:latest
              args: ["--job", "ledger-reconciliation-audit"]
              envFrom:
                - configMapRef:
                    name: erp-config
              resources:
                requests:
                  cpu: "500m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "512Mi"
