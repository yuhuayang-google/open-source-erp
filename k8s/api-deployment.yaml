apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-api
  namespace: erp-system
  labels:
    app: erp-api
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: erp-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: erp-api
        tier: api
    spec:
      serviceAccountName: erp-api-ksa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: erp-api
          image: gcr.io/YOUR_PROJECT_ID/erp-api:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: erp-config
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: erp-api-svc
  namespace: erp-system
  annotations:
    cloud.google.com/neg: '{"ingress": true}' # Container-native Load Balancing via Network Endpoint Groups (NEG)
spec:
  type: ClusterIP
  selector:
    app: erp-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: erp-api-hpa
  namespace: erp-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: erp-api
  minReplicas: 3
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: erp-api-pdb
  namespace: erp-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: erp-api
